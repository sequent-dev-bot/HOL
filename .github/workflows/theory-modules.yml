# Builds HOL with theory value modules against current Poly/ML master on
# Linux and macOS: a fresh full build with tests (on dispatch), and a tree that is
# built, partly cleaned and rebuilt, moved behind a symlink, and moved
# and reconfigured.  The moved-tree job also runs on develop as a
# control, to tell this change's failures from HOL's own.
name: theory-modules

on:
  push:
    branches:
      - "bot/opus/theory-modules-ci"
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [full, moved, window, kernels]

jobs:
  full:
    if: inputs.job == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        hol: [change, develop]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
      - uses: actions/checkout@v5
        with:
          path: hol
          ref: ${{ matrix.hol == 'develop' && 'a9587ae29c265935848b198cfa492a8825e56bfb' || github.sha }}
      - name: Build Poly/ML master
        run: ci/.github/theory-modules/poly.sh
      - name: Configure HOL
        working-directory: hol
        run: poly < tools/smart-configure.sml
      - name: Full build with tests
        working-directory: hol
        run: bin/build -j4 -t
      - name: Diagnostics
        if: always()
        run: ci/.github/theory-modules/diag.sh hol

  moved:
    if: inputs.job == 'moved'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        hol: [change, develop]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
      - uses: actions/checkout@v5
        with:
          path: hol
          ref: ${{ matrix.hol == 'develop' && 'a9587ae29c265935848b198cfa492a8825e56bfb' || github.sha }}
      - name: Build Poly/ML master
        run: ci/.github/theory-modules/poly.sh
      - name: Build up to hol
        working-directory: hol
        run: |
          git log -1 --format='HOL %H %s'
          poly < tools/smart-configure.sml
          bin/build -j4 --seq=tools/sequences/upto-hol
      - name: Partly clean, rebuild with tests
        working-directory: hol
        run: |
          (cd src/num/termination && ../../../bin/Holmake cleanAll)
          (cd src/bool && ../../bin/Holmake cleanAll)
          bin/build -j4 -t --seq=tools/sequences/upto-hol
      - if: always()
        run: ci/.github/theory-modules/diag.sh hol
      - name: Move behind a symlink, rebuild with tests
        if: always()
        run: |
          mv hol hol-moved && ln -s hol-moved hol
          cd hol-moved
          (cd src/num/termination && ../../../bin/Holmake cleanAll)
          bin/build -j4 -t --seq=tools/sequences/upto-hol
      - if: always()
        run: ci/.github/theory-modules/diag.sh hol-moved
      - name: Drop the symlink, reconfigure, rebuild, run the module tests
        if: always()
        run: |
          rm hol
          cd hol-moved
          poly < tools/smart-configure.sml
          (cd src/num/termination && ../../../bin/Holmake cleanAll)
          bin/build -j4 --seq=tools/sequences/upto-hol
          if [ -d tools/Holmake/tests/theory_modules ]; then
            cd tools/Holmake/tests/theory_modules
            ../../../../bin/Holmake cleanAll && ../../../../bin/Holmake
          fi
      - if: always()
        run: ci/.github/theory-modules/diag.sh hol-moved

  # Poly/ML master between saveDependentModuleBasic (2025-09) and
  # showHierarchyWithIds (2026-06): HOL's Meta needs both, so modules
  # stay off, and the probe must expect that.  Runs the change before
  # the probe fix (31fbbb634) and as it is now.
  window:
    if: github.event_name == 'push' || inputs.job == 'window'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        hol: [unfixed, fixed]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
      - uses: actions/checkout@v5
        with:
          path: hol
          ref: ${{ matrix.hol == 'unfixed' && '31fbbb63413674103cedf948ef7ec47e4b67a31e' || github.sha }}
      - name: Build Poly/ML 15a6e83f
        run: ci/.github/theory-modules/poly.sh 15a6e83fbbbcb30eb25c8a77d7f801bf7b25c1d6
      - name: Build up to hol with tests
        working-directory: hol
        run: |
          git log -1 --format='HOL %H %s'
          poly < tools/smart-configure.sml
          bin/build -j4 -t --seq=tools/sequences/upto-hol
      - if: always()
        run: ci/.github/theory-modules/diag.sh hol

  # Every Poly/ML kernel with tests, against Poly/ML master: the module
  # cache is used by stdknl and expknl only, and the others must decline.
  kernels:
    if: inputs.job == 'kernels'
    strategy:
      fail-fast: false
      matrix:
        kernel: [stdknl, expk, otknl, trknl]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
      - uses: actions/checkout@v5
        with:
          path: hol
      - name: Build Poly/ML master
        run: ci/.github/theory-modules/poly.sh
      - name: Build up to hol with tests
        working-directory: hol
        run: |
          poly < tools/smart-configure.sml
          bin/build -j4 -t --${{ matrix.kernel }} --seq=tools/sequences/upto-hol
      - if: always()
        run: ci/.github/theory-modules/diag.sh hol
